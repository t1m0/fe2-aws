name: "Terraform"

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Terraform Init (Backend)
        env:
          BACKEND_BUCKET: ${{ secrets.BACKEND_BUCKET }}
          BACKEND_KEY: ${{ secrets.BACKEND_KEY }}
        run: terraform init -backend-config="bucket=$BACKEND_BUCKET" -backend-config="key=$BACKEND_KEY" -backend-config="region=eu-central-1"

      - name: terraform fmt
        run: terraform fmt -check

      - name: terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v3
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Terraform Init (Backend)
        env:
          BACKEND_BUCKET: ${{ secrets.BACKEND_BUCKET }}
          BACKEND_KEY: ${{ secrets.BACKEND_KEY }}
        run: terraform init -backend-config="bucket=$BACKEND_BUCKET" -backend-config="key=$BACKEND_KEY" -backend-config="region=eu-central-1"

      - name: Terraform Plan
        env:
          TF_VAR_fe2_registry_email: ${{ secrets.FE2_REGISTRY_EMAIL }}
          TF_VAR_fe2_registry_password: ${{ secrets.FE2_REGISTRY_PASSWORD }}
          TF_VAR_owner: ${{ vars.TERRAFORM_OWNER }}
        run: |
          terraform plan -input=false -out="plan-production.tfplan"
          terraform show -no-color plan-production.tfplan > plan-production.txt

      # The binary plan embeds variable values and state in plaintext, and
      # artifacts on a public repo are downloadable, so only upload it encrypted.
      - name: Encrypt Plan
        env:
          PLAN_PASSPHRASE: ${{ secrets.PLAN_PASSPHRASE }}
        run: |
          if [ -z "$PLAN_PASSPHRASE" ]; then
            echo "PLAN_PASSPHRASE secret is not set." >&2
            exit 1
          fi
          printf '%s' "$PLAN_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 plan-production.tfplan
          rm plan-production.tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-production
          path: |
            terraform/plan-production.tfplan.gpg
            terraform/plan-production.txt
          retention-days: 7

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      actions: read
    environment: production

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Terraform Init (Backend)
        env:
          BACKEND_BUCKET: ${{ secrets.BACKEND_BUCKET }}
          BACKEND_KEY: ${{ secrets.BACKEND_KEY }}
        run: terraform init -backend-config="bucket=$BACKEND_BUCKET" -backend-config="key=$BACKEND_KEY" -backend-config="region=eu-central-1"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-production
          path: terraform

      - name: Decrypt Plan
        env:
          PLAN_PASSPHRASE: ${{ secrets.PLAN_PASSPHRASE }}
        run: |
          printf '%s' "$PLAN_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --output plan-production.tfplan \
            --decrypt plan-production.tfplan.gpg

      - name: Terraform Apply (manual gate ensures human plan review)
        env:
          TF_VAR_fe2_registry_email: ${{ secrets.FE2_REGISTRY_EMAIL }}
          TF_VAR_fe2_registry_password: ${{ secrets.FE2_REGISTRY_PASSWORD }}
          TF_VAR_owner: ${{ vars.TERRAFORM_OWNER }}
        run: terraform apply -input=false "plan-production.tfplan"
